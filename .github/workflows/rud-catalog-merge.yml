name: Merge Rud verified catalog

on:
  workflow_dispatch:
  push:
    branches:
      - dev-large-update
    paths:
      - '.github/workflows/rud-catalog-merge.yml'
      - 'scripts/merge_rud_catalog.py'
      - 'assets/rud_*verified*.json'

permissions:
  contents: write

jobs:
  merge-rud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev-large-update

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge Rud verified products
        run: python scripts/merge_rud_catalog.py

      - name: Validate merged JSON app schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          products = json.loads(Path('assets/products.json').read_text(encoding='utf-8'))
          ids = set()
          rud = 0
          for p in products:
              for key in ('id','name','category','carbs'):
                  if key not in p:
                      raise SystemExit(f'Missing {key} in product {p.get("id")}')
              pid = str(p['id']).strip()
              if pid in ids:
                  raise SystemExit(f'Duplicate product id: {pid}')
              ids.add(pid)
              if str(p.get('manufacturer','')).strip().lower() in {'рудь','rud'} or pid.startswith('ua_rud_'):
                  rud += 1
          if rud < 20:
              raise SystemExit(f'Unexpectedly low Rud count after merge: {rud}')
          print(f'Validated {len(products)} products; Rud records: {rud}')
          PY

      - name: Commit merged products.json
        run: |
          if git diff --quiet -- assets/products.json; then
            echo 'products.json already contains all verified Rud rows'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products.json
          git commit -m 'data: integrate verified Rud products into app catalog'
          git push origin HEAD:dev-large-update
