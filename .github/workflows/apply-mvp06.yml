name: Apply MVP 0.6 migration

on:
  push:
    branches: [mvp-0.6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply MVP 0.6 migration') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mvp-0.6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python scripts/apply_mvp06.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'Apply MVP 0.6 migration'
          git push origin HEAD:mvp-0.6
