# promoted to mvp-0.6. Keep it only for an explicit manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain legacy workflow
        run: |
          echo "Legacy repair workflow is disabled for automatic runs."
