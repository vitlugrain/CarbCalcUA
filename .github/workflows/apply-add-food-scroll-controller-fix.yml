name: Apply add-food explicit scroll fix

on:
  push:
    branches: [dev-large-update]
    paths:
      - 'scripts/apply_add_food_scroll_controller_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-large-update
      - name: Apply patch
        run: python3 scripts/apply_add_food_scroll_controller_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "ui: explicitly scroll to quantity controls"
          git push origin HEAD:dev-large-update
