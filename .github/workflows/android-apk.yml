name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, mvp-0.6]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Test and build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Apply diary fixes
        run: |
          python3 scripts/apply_diary_fixes.py
          if git diff --quiet -- lib/main.dart pubspec.yaml; then
            echo "Diary fixes already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart pubspec.yaml
            git commit -m "Fix diary date time calendar and meal grouping"
            git push
            echo "Diary fixes applied and committed; stop this run so the next run tests the fixed commit."
            exit 0
          fi
      - name: Repair MVP 0.6 source
        run: |
          python3 scripts/repair_mvp06_tail.py
          if git diff --quiet -- lib/main.dart; then
            echo "MVP 0.6 source already repaired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart
            git commit -m "Repair MVP 0.6 tail"
            git push
            echo "Source repaired and committed; stop this run so the next run tests the repaired commit."
            exit 0
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name carbcalc_ua .
          rm -f test/widget_test.dart
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: CarbCalcUA-0.6.0-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
