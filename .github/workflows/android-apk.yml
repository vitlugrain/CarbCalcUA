name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, mvp-0.6]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Test and build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply diary fixes
        run: |
          python3 scripts/apply_diary_fixes.py
          if git diff --quiet -- lib/main.dart pubspec.yaml; then
            echo "Diary fixes already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart pubspec.yaml
            git commit -m "Fix diary date time calendar and meal grouping"
            git push
            echo "Diary fixes applied and committed; stop this run so the next run tests the fixed commit."
            exit 0
          fi

      - name: Repair MVP 0.6 source
        run: |
          python3 scripts/repair_mvp06_tail.py
          if git diff --quiet -- lib/main.dart; then
            echo "MVP 0.6 source already repaired"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart
            git commit -m "Repair MVP 0.6 tail"
            git push
            echo "Source repaired and committed; stop this run so the next run tests the repaired commit."
            exit 0
          fi

      - name: Build USDA offline food database
        run: python3 scripts/build_usda_offline_db.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name carbcalc_ua .
          rm -f test/widget_test.dart

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Required signing secrets are missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/carbcalc-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=carbcalc
          storeFile=carbcalc-upload-key.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('Generated Android project does not contain android/app/build.gradle.kts')
          s = p.read_text()
          props = """\nimport java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n"""
          if 'keystorePropertiesFile' not in s:
              s = props + s
          old = 'buildTypes {\n        release {\n            // TODO: Add your own signing config for the release build.\n            // Signing with the debug keys for now, so `flutter run --release` works.\n            signingConfig = signingConfigs.getByName("debug")\n        }\n    }'
          new = '''signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("release")\n        }\n    }'''
          if old not in s and 'signingConfig = signingConfigs.getByName("release")' not in s:
              raise SystemExit('Unexpected generated Gradle Kotlin structure')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Resolve packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: CarbCalcUA-0.6.0-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
